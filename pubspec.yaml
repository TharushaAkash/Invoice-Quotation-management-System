name: etech_electricals
description: E-Tech Electricals - Modern Desktop Business Management Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase (using REST API for desktop)
  http: ^1.1.0
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  intl: ^0.19.0
  
  # State Management
  provider: ^6.1.1
  
  # Utilities
  uuid: ^4.2.1

  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.2

  # Storage & File Picking
  shared_preferences: ^2.2.2
  file_picker: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # Assets
  # assets:
  #   - assets/images/
  
  # Fonts (optional - using Google Fonts)
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf

# Server Configuration
server.port=8080
spring.application.name=etech-electricals-backend

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,https://your-app.netlify.app
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Firebase Configuration
# Place your firebase-service-account.json in src/main/resources/
firebase.config.path=classpath:firebase-service-account.json

# Logging
logging.level.com.etech=DEBUG
logging.level.org.springframework.web=INFO


